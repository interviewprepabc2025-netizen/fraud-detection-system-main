global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "velocity-agent"
    static_configs:
      - targets: ["velocity-agent:8000"]

  - job_name: "geolocation-agent"
    static_configs:
      - targets: ["geolocation-agent:8000"]

  - job_name: "behavioral-agent"
    static_configs:
      - targets: ["behavioral-agent:8000"]

  - job_name: "network-agent"
    static_configs:
      - targets: ["network-agent:8000"]

  - job_name: "supervisor-agent"
    static_configs:
      - targets: ["supervisor-agent:8000"]

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8888"]
