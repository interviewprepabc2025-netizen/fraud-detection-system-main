x-kafka-env: &kafka-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_SCHEMA_REGISTRY_URL: http://schema-registry:8081

x-agent-env: &agent-env
  <<: *kafka-env
  REDIS_HOST: redis
  REDIS_PORT: 6379
  MLFLOW_TRACKING_URI: http://mlflow:5000
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317

x-spark-env: &spark-env
  # Spark cluster
  SPARK_MASTER_URL: spark://spark-master:7077
  # Delta Lake lakehouse on MinIO
  DELTA_LAKE_BASE: s3a://fraud-lake
  MINIO_ENDPOINT: http://minio:9000
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
  # Feature pipeline
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  TOPIC_RAW_TRANSACTIONS: ${TOPIC_RAW_TRANSACTIONS:-raw-transactions}
  TOPIC_ENRICHED_TRANSACTIONS: ${TOPIC_ENRICHED_TRANSACTIONS:-enriched-transactions}
  TOPIC_AGENT_VERDICTS: ${TOPIC_AGENT_VERDICTS:-agent-verdicts}
  REDIS_HOST: redis
  REDIS_PORT: 6379

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  fraud-net:
    driver: bridge

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres-data:
  redis-data:
  minio-data:
  mlflow-data:
  zookeeper-data:
  kafka-data:
  spark-history-data:

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    hostname: zookeeper
    networks: [fraud-net]
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    networks: [fraud-net]
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_MESSAGE_MAX_BYTES: 10485760
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    hostname: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    networks: [fraud-net]
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on: [kafka, schema-registry]
    networks: [fraud-net]
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081

  redis:
    image: redis:7.2-alpine
    hostname: redis
    networks: [fraud-net]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    hostname: postgres
    networks: [fraud-net]
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fraud_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-fraud_detection}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fraud_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    hostname: minio
    networks: [fraud-net]
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MLflow ──────────────────────────────────────────────────────────────────

  mlflow:
    build:
      context: ./mlflow
      dockerfile: Dockerfile
    hostname: mlflow
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [fraud-net]
    ports:
      - "5001:5000"
    volumes:
      - mlflow-data:/mlflow
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER:-fraud_user}:${POSTGRES_PASSWORD:-changeme_in_production}@postgres:5432/${MLFLOW_DB:-mlflow}
      MLFLOW_ARTIFACT_ROOT: s3://mlflow/
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Airflow ─────────────────────────────────────────────────────────────────

  # ── Feast feature-store initialisation ─────────────────────────────────────
  # Creates offline Parquet data files and runs `feast apply` (writes registry.db).
  # Runs once; airflow services wait for it to complete.

  feast-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      redis:
        condition: service_healthy
    networks: [fraud-net]
    volumes:
      - ./feature_repo:/opt/airflow/feature_repo
      - ./scripts:/scripts:ro
    environment:
      FEAST_REPO_PATH: /opt/airflow/feature_repo
      REDIS_HOST: redis
      REDIS_PORT: 6379
    entrypoint: /bin/bash
    command: -c "python /scripts/init_feast.py"
    restart: "no"

  # ── PostgreSQL training-data seed ───────────────────────────────────────────
  # Inserts 2 000 synthetic labelled rows so the retraining DAG has data.

  db-seed:
    image: python:3.11-slim
    depends_on:
      postgres:
        condition: service_healthy
    networks: [fraud-net]
    volumes:
      - ./scripts:/scripts:ro
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-fraud_detection}
      POSTGRES_USER: ${POSTGRES_USER:-fraud_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
    command: >
      bash -c "pip install psycopg2-binary numpy --quiet &&
               python /scripts/seed_training_data.py"
    restart: "no"

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      postgres:
        condition: service_healthy
      feast-init:
        condition: service_completed_successfully
    networks: [fraud-net]
    volumes:
      - ./feature_repo:/opt/airflow/feature_repo
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-fraud_user}:${POSTGRES_PASSWORD:-changeme_in_production}@postgres:5432/${AIRFLOW_DB:-airflow}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
    command:
      - bash
      - -c
      - >-
        airflow db migrate &&
        airflow users create
        --username admin
        --firstname Admin
        --lastname User
        --role Admin
        --email admin@frauddetect.local
        --password ${AIRFLOW_ADMIN_PASSWORD:-changeme_in_production}
    restart: "no"

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      db-seed:
        condition: service_completed_successfully
    networks: [fraud-net]
    ports:
      - "8082:8080"
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./shared:/opt/airflow/shared:ro
      - ./spark:/opt/airflow/spark:ro
      - ./feature_repo:/opt/airflow/feature_repo
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-fraud_user}:${POSTGRES_PASSWORD:-changeme_in_production}@postgres:5432/${AIRFLOW_DB:-airflow}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:-changeme}
      # Spark + Delta config for PythonOperator batch jobs
      SPARK_MASTER_URL: local[4]
      DELTA_LAKE_BASE: s3a://fraud-lake
      MINIO_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # PostgreSQL — needed by fraud_model_retraining DAG
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-fraud_detection}
      POSTGRES_USER: ${POSTGRES_USER:-fraud_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
      # MLflow — needed by fraud_model_retraining DAG
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: fraud-detection
      MLFLOW_MODEL_NAME: fraud-classifier
      FEAST_REPO_PATH: /opt/airflow/feature_repo
      PYTHONPATH: /opt/airflow
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      db-seed:
        condition: service_completed_successfully
    networks: [fraud-net]
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./shared:/opt/airflow/shared:ro
      - ./spark:/opt/airflow/spark:ro
      - ./feature_repo:/opt/airflow/feature_repo
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-fraud_user}:${POSTGRES_PASSWORD:-changeme_in_production}@postgres:5432/${AIRFLOW_DB:-airflow}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      # Spark + Delta config for PythonOperator batch jobs
      SPARK_MASTER_URL: local[4]
      DELTA_LAKE_BASE: s3a://fraud-lake
      MINIO_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # PostgreSQL — needed by fraud_model_retraining DAG
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-fraud_detection}
      POSTGRES_USER: ${POSTGRES_USER:-fraud_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
      # MLflow — needed by fraud_model_retraining DAG
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: fraud-detection
      MLFLOW_MODEL_NAME: fraud-classifier
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      FEAST_REPO_PATH: /opt/airflow/feature_repo
      PYTHONPATH: /opt/airflow
    command: scheduler

  # ── Agent Microservices ──────────────────────────────────────────────────────

  velocity-agent:
    build:
      context: .
      dockerfile: agents/velocity/Dockerfile
    hostname: velocity-agent
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [fraud-net]
    ports:
      - "${VELOCITY_AGENT_PORT:-8001}:8001"
    env_file: .env
    environment:
      <<: *agent-env
      AGENT_PORT: 8001
    restart: unless-stopped

  geolocation-agent:
    build:
      context: .
      dockerfile: agents/geolocation/Dockerfile
    hostname: geolocation-agent
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [fraud-net]
    ports:
      - "${GEOLOCATION_AGENT_PORT:-8002}:8002"
    env_file: .env
    environment:
      <<: *agent-env
      AGENT_PORT: 8002
    restart: unless-stopped

  behavioral-agent:
    build:
      context: .
      dockerfile: agents/behavioral/Dockerfile
    hostname: behavioral-agent
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [fraud-net]
    ports:
      - "${BEHAVIORAL_AGENT_PORT:-8003}:8003"
    env_file: .env
    environment:
      <<: *agent-env
      AGENT_PORT: 8003
    restart: unless-stopped

  network-agent:
    build:
      context: .
      dockerfile: agents/network/Dockerfile
    hostname: network-agent
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [fraud-net]
    ports:
      - "${NETWORK_AGENT_PORT:-8004}:8004"
    env_file: .env
    environment:
      <<: *agent-env
      AGENT_PORT: 8004
    restart: unless-stopped

  supervisor-agent:
    build:
      context: .
      dockerfile: agents/supervisor/Dockerfile
    hostname: supervisor-agent
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    networks: [fraud-net]
    ports:
      - "${SUPERVISOR_AGENT_PORT:-8005}:8005"
    env_file: .env
    environment:
      <<: *agent-env
      AGENT_PORT: 8005
    restart: unless-stopped

  # ── MinIO Bucket Initialisation ─────────────────────────────────────────────
  # Creates fraud-lake, mlflow, and spark-history buckets on first run.

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    networks: [fraud-net]
    entrypoint:
      - /bin/sh
      - -c
      - |
        /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin
        /usr/bin/mc mb --ignore-existing myminio/fraud-lake
        /usr/bin/mc mb --ignore-existing myminio/mlflow
        /usr/bin/mc mb --ignore-existing myminio/spark-history
        echo 'MinIO buckets initialised.'
    restart: "no"

  # ── Spark Standalone Cluster ─────────────────────────────────────────────────
  # Master + 2 Workers running the custom image (JARs pre-baked for fast start)

  spark-master:
    build:
      context: .
      dockerfile: spark/Dockerfile
    hostname: spark-master
    networks: [fraud-net]
    ports:
      - "8090:8080"   # Spark Master Web UI
      - "7077:7077"   # Spark Master port (workers connect here)
    environment:
      SPARK_DAEMON: master
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 15s
      timeout: 10s
      retries: 5

  spark-worker-1:
    build:
      context: .
      dockerfile: spark/Dockerfile
    hostname: spark-worker-1
    networks: [fraud-net]
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      SPARK_DAEMON: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_CORES: 2

  spark-worker-2:
    build:
      context: .
      dockerfile: spark/Dockerfile
    hostname: spark-worker-2
    networks: [fraud-net]
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      SPARK_DAEMON: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_CORES: 2

  # ── Spark History Server ──────────────────────────────────────────────────────
  # Stores completed job logs in MinIO; browse at http://localhost:18080

  spark-history-server:
    build:
      context: .
      dockerfile: spark/Dockerfile
    hostname: spark-history
    networks: [fraud-net]
    depends_on:
      minio-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_healthy
    ports:
      - "18080:18080"  # Spark History Server UI
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    # Override entrypoint to start the history server directly
    entrypoint:
      - /opt/spark/bin/spark-class
      - -Dspark.history.fs.logDirectory=s3a://spark-history/logs
      - -Dspark.hadoop.fs.s3a.endpoint=http://minio:9000
      - -Dspark.hadoop.fs.s3a.access.key=${AWS_ACCESS_KEY_ID:-minioadmin}
      - -Dspark.hadoop.fs.s3a.secret.key=${AWS_SECRET_ACCESS_KEY:-minioadmin}
      - -Dspark.hadoop.fs.s3a.path.style.access=true
      - -Dspark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
      - org.apache.spark.deploy.history.HistoryServer

  # ── Spark Streaming: Transaction Enricher ────────────────────────────────────
  # Reads raw-transactions from Kafka, enriches with Redis features, writes to
  # Delta Bronze + Silver, and publishes enriched-transactions back to Kafka.
  # Runs two concurrent streaming queries:
  #   Query 1 — per-transaction enrichment (foreachBatch, 500 ms trigger)
  #   Query 2 — 1-hour tumbling window velocity aggregations → Delta Silver

  spark-streaming-enricher:
    build:
      context: .
      dockerfile: spark/Dockerfile
    hostname: spark-streaming-enricher
    networks: [fraud-net]
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      spark-master:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *spark-env
      JOB_SCRIPT: /app/spark/streaming/transaction_enricher.py
      SPARK_MASTER_URL: "local[2]"
    restart: unless-stopped

  # ── Spark Streaming: Fraud Decision Sink ─────────────────────────────────────
  # Reads supervisor decisions from agent-verdicts and writes them to Delta Gold.
  # Replaces the plain-Python storage_consumer for the Gold layer persistence.

  spark-streaming-sink:
    build:
      context: .
      dockerfile: spark/Dockerfile
    hostname: spark-streaming-sink
    networks: [fraud-net]
    depends_on:
      kafka:
        condition: service_healthy
      spark-master:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *spark-env
      JOB_SCRIPT: /app/spark/streaming/decision_sink.py
      SPARK_MASTER_URL: "local[2]"
    restart: unless-stopped

  # ── Kafka Producers / Consumers ─────────────────────────────────────────────

  transaction-producer:
    build:
      context: .
      dockerfile: kafka/producers/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
    networks: [fraud-net]
    env_file: .env
    environment:
      <<: *kafka-env
    restart: unless-stopped

  # ── Observability ────────────────────────────────────────────────────────────

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.100.0
    networks: [fraud-net]
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./config/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro

  prometheus:
    image: prom/prometheus:v2.52.0
    networks: [fraud-net]
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:10.4.3
    depends_on: [prometheus]
    networks: [fraud-net]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-changeme_in_production}
